<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fernando Leite Pagani — Open Graph card</title>
    <style>
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2')
          format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2')
          format('woff2');
        font-weight: 500;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }
      body {
        background: #000;
        color: #ededed;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px;
        gap: 44px;
        align-items: center;
        width: 1080px;
        height: 540px;
        padding: 52px 56px;
        background: #000;
        border: 1px solid #2b2b2b;
        border-radius: 8px;
      }
      .content {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-width: 0;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 18px;
        color: #8a8a8a;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 5px 10px;
        color: #a3a3a3;
        border: 1px solid #2b2b2b;
        border-radius: 999px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #00d95a;
      }
      h1 {
        margin: 38px 0 0;
        font-size: 50px;
        font-weight: 500;
        line-height: 1.08;
        letter-spacing: -0.045em;
      }
      .role {
        margin: 16px 0 0;
        max-width: 620px;
        color: #a3a3a3;
        font-size: 17px;
        line-height: 1.5;
      }
      .stats {
        display: flex;
        gap: 42px;
        margin-top: auto;
        padding-top: 22px;
        border-top: 1px dashed #2b2b2b;
      }
      .stats div {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .stats b {
        font-size: 28px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .stats span {
        color: #8a8a8a;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .foot {
        margin-top: 18px;
        color: #8a8a8a;
        font-size: 11px;
      }
      .portrait {
        width: 220px;
        height: 220px;
        object-fit: cover;
        border: 1px solid #2b2b2b;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="content">
        <div class="eyebrow">
          <span class="badge"><span class="dot"></span> Open to internships</span>
          <span>Belo Horizonte, MG</span>
        </div>
        <h1>Fernando Leite<br />Pagani</h1>
        <p class="role">Computer Science student · Linux, systems &amp; DevOps</p>
        <div class="stats">
          <div><b>14</b><span>Public repos</span></div>
          <div><b>100+</b><span>Contributions</span></div>
          <div><b>29</b><span>Pull requests</span></div>
          <div><b>41</b><span>Issues</span></div>
        </div>
        <div class="foot">fernandoleitepagani-portfolio.vercel.app</div>
      </div>
      <img class="portrait" src="../../public/photo.jpg" alt="" />
    </div>
  </body>
</html>
