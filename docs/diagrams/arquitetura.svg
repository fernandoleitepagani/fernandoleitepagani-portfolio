<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.title{font-size:24px;font-weight:700}.label{font-size:17px;font-weight:700}.sub{font-size:13px;fill:#4b5563}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.front{fill:#ecfdf5;stroke:#16a34a;stroke-width:2}.server{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.external{fill:#fef3c7;stroke:#d97706;stroke-width:2}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.note{font-size:13px;fill:#334155}</style><text x="50" y="58" class="title">Arquitetura — visão geral</text>
<rect x="65" y="170" width="300" height="220" rx="18" class="front"/><text x="215" y="215" text-anchor="middle" class="label">Navegador · React SPA</text><text x="95" y="265" class="sub">• React 19 + TypeScript + Vite</text><text x="95" y="295" class="sub">• Rotas, idioma PT/EN e temas</text><text x="95" y="325" class="sub">• Páginas + dados curados</text><text x="95" y="355" class="sub">• Sem token GitHub no cliente</text>
<rect x="450" y="170" width="300" height="220" rx="18" class="server"/><text x="600" y="215" text-anchor="middle" class="label">Vercel Function</text><text x="480" y="265" class="sub">GET /api/github</text><text x="480" y="295" class="sub">• GITHUB_TOKEN server-only</text><text x="480" y="325" class="sub">• GraphQL + REST</text><text x="480" y="355" class="sub">• Cache CDN · fallback</text>
<rect x="835" y="170" width="300" height="220" rx="18" class="external"/><text x="985" y="215" text-anchor="middle" class="label">GitHub API</text><text x="865" y="265" class="sub">GraphQL: contributions</text><text x="865" y="295" class="sub">REST: profile / repositories</text><text x="865" y="325" class="sub">Dados públicos do usuário</text>
<path d="M365 270 H438" class="arrow"/><text x="400" y="250" text-anchor="middle" class="note">HTTPS</text><path d="M750 270 H823" class="arrow"/><text x="786" y="250" text-anchor="middle" class="note">token</text>
<path d="M835 340 H760" class="arrow"/><path d="M450 340 H375" class="arrow"/><text x="600" y="455" text-anchor="middle" class="note">A resposta normalizada alimenta heatmap, métricas e cards de projeto.</text>
<rect x="310" y="505" width="580" height="72" rx="12" fill="#fff" stroke="#94a3b8"/><text x="600" y="535" text-anchor="middle" class="label">EmailJS (cliente)</text><text x="600" y="558" text-anchor="middle" class="sub">Formulário envia notificação e resposta automática</text>
</svg>